[package]
name = "diskdrift"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
description = "Find out where your macOS storage went — read-only storage forensics CLI"
license = "MIT"
repository = "https://github.com/VIUK-Light/Diskdrift"
readme = "README.md"

[lib]
name = "diskdrift"
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2.189"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
