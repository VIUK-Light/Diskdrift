[package]
name = "diskdrift"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Find out where your macOS storage went — read-only storage forensics CLI"
license = "MIT"

[dependencies]
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
