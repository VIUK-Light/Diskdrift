name: Fix stale docs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-stale-docs.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stale documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "README.md",
              "git clone https://github.com/<your-account>/diskdrift.git",
              "git clone https://github.com/VIUK-Light/Diskdrift.git",
          )
          replace(
              "README.md",
              "`purge` command, and there never will be in v0.1.",
              "`purge` command; destructive cleanup remains out of scope.",
          )
          replace(
              "README.md",
              "- v0.1 scans a curated set of locations (see `src/scanners/`), not the entire\n  filesystem. Use `--root` to scan anything else.",
              "- DiskDrift scans a curated set of locations (see `src/scanners/`), not the entire\n  filesystem. Use `--root` to scan anything else.",
          )

          replace("docs/DESIGN.md", "# DiskDrift v0.1 — Design", "# DiskDrift — Design")
          replace(
              "docs/DESIGN.md",
              "DiskDrift v0.1. The priority order is:",
              "DiskDrift through v0.6. The priority order is:",
          )
          replace(
              "docs/DESIGN.md",
              "## 12. Future work (explicitly not v0.1)",
              "## 12. Future work",
          )
          replace(
              "docs/DESIGN.md",
              "- FSEvents-based change timeline: \"between 13:20 and 13:30, CoreSimulator grew\n  by 17 GB\".\n",
              "",
          )
          replace(
              "docs/DESIGN.md",
              "  process; v0.1 has no deletion capability at all.",
              "  process; DiskDrift has no deletion capability.",
          )

          replace(
              "src/lib.rs",
              "//! v0.1 is read-only by design: it scans, snapshots, diffs and explains.",
              "//! DiskDrift is read-only by design: it scans, snapshots, diffs and explains.",
          )
          PY

          rm .github/workflows/fix-stale-docs.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/DESIGN.md src/lib.rs .github/workflows/fix-stale-docs.yml
          git diff --cached --check
          git commit -m "Refresh documentation for v0.6"
          git push
